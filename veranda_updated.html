<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Блокнот Официанта</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Защита от случайного выделения и зума на iPhone */
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    input {
      -webkit-user-select: auto;
      user-select: auto;
    }
  </style>
</head>
<body class="bg-gray-100 h-full text-gray-800 flex flex-col font-sans pb-safe">

  <!-- Шапка -->
  <header class="bg-indigo-600 text-white pt-10 pb-3 px-4 shadow-md sticky top-0 z-30">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="font-bold text-lg flex items-center gap-2">
        <i class="fa-solid fa-utensils"></i> Официант App
      </h1>
      <span id="order-badge" class="bg-red-500 text-white text-xs font-bold px-2.5 py-0.5 rounded-full hidden">
        0
      </span>
    </div>
  </header>

  <!-- Навигация по вкладкам -->
  <nav class="bg-white border-b border-gray-200 sticky top-[68px] z-20 shadow-sm">
    <div class="max-w-md mx-auto flex">
      <button onclick="switchTab('availability')" id="tab-availability" class="flex-1 py-3 text-center font-medium border-b-2 border-indigo-600 text-indigo-600">
        <i class="fa-solid fa-clipboard-check mr-1"></i> 1. Наличие (Кухня)
      </button>
      <button onclick="switchTab('order')" id="tab-order" class="flex-1 py-3 text-center font-medium text-gray-500 border-b-2 border-transparent">
        <i class="fa-solid fa-cart-shopping mr-1"></i> 2. Приём заказа
      </button>
    </div>
  </nav>

  <!-- Основной контент -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 pb-36 overflow-y-auto">

    <!-- Вкладка 1: Простановка наличия блюд -->
    <section id="view-availability" class="space-y-3">
      <div class="bg-amber-50 p-3 rounded-xl text-xs text-amber-800 border border-amber-200 mb-3 flex items-start gap-2">
        <i class="fa-solid fa-triangle-exclamation text-amber-600 mt-0.5"></i>
        <span>Отметьте <b>«+ Есть»</b> у блюд в наличии. Только они отобразятся во вкладке приёма заказа.</span>
      </div>

      <!-- Категории для кухни -->
      <div class="flex gap-2 overflow-x-auto pb-2 mb-2 no-scrollbar" id="categories-avail"></div>

      <div id="availability-menu-list" class="space-y-2"></div>
    </section>

    <!-- Вкладка 2: Прием заказа -->
    <section id="view-order" class="hidden space-y-3">
      <!-- Категории для заказа -->
      <div class="flex gap-2 overflow-x-auto pb-2 mb-2 no-scrollbar" id="categories-order"></div>

      <div id="order-menu-list" class="space-y-2"></div>
    </section>

  </main>

  <!-- Нижняя панель с итогом заказа -->
  <div id="cart-drawer" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-4px_20px_rgba(0,0,0,0.1)] p-4 max-w-md mx-auto z-40 rounded-t-2xl">
    <div class="flex justify-between items-center mb-2">
      <span class="font-bold text-gray-700 text-sm">Выбрано в заказ:</span>
      <span id="cart-total" class="font-black text-xl text-indigo-600">0 ₽</span>
    </div>
    
    <div id="cart-items-summary" class="max-h-28 overflow-y-auto mb-3 text-xs divide-y divide-gray-100">
      <p class="text-gray-400 italic py-1">Заказ пуст</p>
    </div>

    <div class="flex gap-2">
      <button onclick="clearCart()" class="w-1/3 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 py-3 rounded-xl text-sm font-semibold transition">
        Очистить
      </button>
      <button onclick="submitOrder()" class="w-2/3 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white py-3 rounded-xl text-sm font-semibold transition flex justify-center items-center gap-2 shadow-md">
        <i class="fa-solid fa-check"></i> Готово
      </button>
    </div>
  </div>

  <!-- Окно создания заказа -->
  <div id="order-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-5 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-lg">Новый заказ</h2>
        <button onclick="closeOrderModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-600">×</button>
      </div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">Название заказа</label>
      <input id="order-name-input" type="text" maxlength="60" placeholder="Например: Стол 5"
        class="w-full border border-gray-200 rounded-xl px-3 py-3 mb-4 outline-none focus:ring-2 focus:ring-indigo-500">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Примечание</label>
      <textarea id="order-note-input" rows="4" maxlength="300" placeholder="Например: без лука, принести позже"
        class="w-full border border-gray-200 rounded-xl px-3 py-3 mb-4 outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      <div class="flex gap-2">
        <button onclick="closeOrderModal()" class="w-1/3 bg-gray-100 text-gray-700 py-3 rounded-xl font-semibold">Отмена</button>
        <button onclick="saveNewOrder()" class="w-2/3 bg-indigo-600 text-white py-3 rounded-xl font-semibold">Создать заказ</button>
      </div>
    </div>
  </div>

  <script>
    // Меню из ваших фото
    const defaultMenu = [

      { id: 8, name: "Рыбный сет 200г", category: "Холодные закуски", price: 950, desc: "филе лосося, масляная рыба, багет, творожный сыр", available: false },

      // Горячие закуски
      { id: 9, name: "Пряные крылья от Шефа 8шт", category: "Горячие закуски", price: 580, desc: "соус BBQ, соус блю-чиз", available: false },
      { id: 10, name: "Хрустящие креветки 150г", category: "Горячие закуски", price: 800, desc: "с соусом васаби и унаги, спринг-тесто, кунжут", available: false },
      { id: 11, name: "Чесночные гренки 200г", category: "Горячие закуски", price: 250, desc: "", available: false },

      // Салаты
      { id: 12, name: "Салат с куриным филе и беконом 200г", category: "Салаты", price: 530, desc: "томаты, огурец, яйцо, провансальский соус", available: false },
      { id: 13, name: "Греческий с брынзой и базиликом 210г", category: "Салаты", price: 450, desc: "микс салата, перец, томат, огурец, оливки", available: false },
      { id: 14, name: "Цезарь с курицей 220г", category: "Салаты", price: 550, desc: "пармезан, крутоны, соус цезарь, черри", available: false },

      { id: 16, name: "Салат с бужениной и картофелем 250г", category: "Салаты", price: 680, desc: "буженина, картофель, бекон, медово-горчичный соус", available: false },

      { id: 18, name: "Салат с цыпленком и апельсином 220г", category: "Салаты", price: 500, desc: "филе цыпленка, микс салатов, апельсин, черри, лук фри", available: false },
      { id: 19, name: "Грузинский салат 250г", category: "Салаты", price: 700, desc: "говядина, баклажаны, помидоры, перец, грецкий орех, кинза", available: false },

      // Супы
      { id: 20, name: "Борщ с говяжьими щечками 250мл", category: "Супы", price: 450, desc: "", available: false },
      { id: 21, name: "Том-ям с морепродуктами 250мл", category: "Супы", price: 700, desc: "куриный бульон, тыква, груша, кокосовое молоко, пряности", available: false },
      { id: 22, name: "Крем-суп из овощей с беконом 250мл", category: "Супы", price: 350, desc: "с беконом и пармезаном", available: false },
      { id: 23, name: "Крем-суп из тыквы с креветкой 250мл", category: "Супы", price: 450, desc: "тыква, креветка, сливки, креветочный биск", available: false },

      // Гарниры
      { id: 24, name: "Картофель (фри / печеный / пюре) 200г", category: "Гарниры", price: 200, desc: "выберите вид картофеля", available: false },
      { id: 25, name: "Микс овощей на гриле 200г", category: "Гарниры", price: 300, desc: "цукини, баклажан, болгарский перец, томат", available: false },

      // Основные блюда
      { id: 26, name: "Паста Карбонара 250г", category: "Основные блюда", price: 500, desc: "", available: false },
      { id: 27, name: "Паста с брокколи и креветками 250г", category: "Основные блюда", price: 650, desc: "", available: false },
      { id: 28, name: "Говяжьи щечки 300г", category: "Основные блюда", price: 800, desc: "картофельное пюре, соус демиглас", available: false },
      { id: 29, name: "Стейк из говяжьей вырезки 300г", category: "Основные блюда", price: 950, desc: "с пестрым салатом, морковь, огурец, кинза", available: false },
      { id: 30, name: "Карельский судак 300г", category: "Основные блюда", price: 700, desc: "цукини, микс салат, клюква, соус на копченых сливках", available: false },

      { id: 33, name: "Бефстроганов с картофелем 300г", category: "Основные блюда", price: 700, desc: "говядина, грибы, сливочный соус, запеченый картофель", available: false },
      { id: 34, name: "Свинина WOK 300г", category: "Основные блюда", price: 850, desc: "свинина, картофель, фасоль стручковая, лук", available: false },

      // Блюда на мангале
      { id: 35, name: "Барбекю на компанию 1500г", category: "Мангал", price: 3950, desc: "шашлык свиной, бедро куриное, крылья, баранина, овощи", available: false },
      { id: 36, name: "Шашлык куриный 270г", category: "Мангал", price: 550, desc: "с шашлычным соусом, луком и зеленью", available: false },
      { id: 37, name: "Бедро куриное 270г", category: "Мангал", price: 600, desc: "с шашлычным соусом, луком и зеленью", available: false },
      { id: 38, name: "Шашлык свиной 270г", category: "Мангал", price: 650, desc: "с шашлычным соусом, луком и зеленью", available: false },
      { id: 39, name: "Соус в ассортименте 50г", category: "Мангал", price: 100, desc: "кисло-сладкий/устричный/чили-манго/аджика/ореховый/сырный/томатный", available: false },

      // Детское меню
      { id: 40, name: "Крем-суп из овощей и курицы 250мл", category: "Детское меню", price: 250, desc: "", available: false },
      { id: 41, name: "Куриная лапша с перепелиным яйцом 250мл", category: "Детское меню", price: 200, desc: "лапша, перепелиное яйцо, бульон, крутоны", available: false },
      { id: 42, name: "Фарфалле с курицей и овощами 250мл", category: "Детское меню", price: 250, desc: "паста, курица, черри, цукини, сливки", available: false },
      { id: 43, name: "Наггетсы и картофель фри 250г", category: "Детское меню", price: 350, desc: "", available: false },
      { id: 44, name: "Мини шашлычок из курочки 170г", category: "Детское меню", price: 350, desc: "с кетчупом и овощами", available: false },

      // Десерты & Хлеб
      { id: 45, name: "Наполеон", category: "Десерты", price: 350, desc: "", available: false },
      { id: 46, name: "Шоколадный медовик", category: "Десерты", price: 350, desc: "", available: false },
      { id: 47, name: "Сладкий калейдоскоп", category: "Десерты", price: 350, desc: "лимон-персик / шоколад-карамель", available: false },
      { id: 48, name: "Меренговый рулет с клубникой", category: "Десерты", price: 350, desc: "доступен по предзаказу от 7 порций", available: false },
      { id: 49, name: "Мороженое с ягодами (2 шарика)", category: "Десерты", price: 350, desc: "", available: false },
      { id: 50, name: "Карамельно-яблочный тарт", category: "Десерты", price: 350, desc: "", available: false },
      { id: 51, name: "Хлебная корзина", category: "Десерты", price: 200, desc: "чиабатта, хлеб, багет домашний", available: false }
    ];

    let menu = JSON.parse(localStorage.getItem('waiter_veranda_menu')) || defaultMenu;
    let order = {};
    let completedOrders = JSON.parse(localStorage.getItem('waiter_veranda_orders')) || [];
    let activeCategoryAvail = 'Все';
    let activeCategoryOrder = 'Все';

    function saveMenu() {
      localStorage.setItem('waiter_veranda_menu', JSON.stringify(menu));
    }

    function switchTab(tab) {
      const tabs = {
        availability: document.getElementById('tab-availability'),
        order: document.getElementById('tab-order'),
        orders: document.getElementById('tab-orders')
      };
      const views = {
        availability: document.getElementById('view-availability'),
        order: document.getElementById('view-order'),
        orders: document.getElementById('view-orders')
      };

      Object.keys(tabs).forEach(key => {
        tabs[key].className = key === tab
          ? "flex-1 py-3 text-center font-medium border-b-2 border-indigo-600 text-indigo-600"
          : "flex-1 py-3 text-center font-medium text-gray-500 border-b-2 border-transparent";
      });

      Object.keys(views).forEach(key => {
        views[key].classList.toggle('hidden', key !== tab);
      });

      document.getElementById('cart-drawer').classList.toggle('hidden', tab !== 'order');
      render();
    }

    function renderCategories() {
      const categories = ['Все', ...new Set(menu.map(i => i.category))];
      
      const containerAvail = document.getElementById('categories-avail');
      containerAvail.innerHTML = categories.map(cat => `
        <button onclick="setCategoryAvail('${cat}')" 
          class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
            activeCategoryAvail === cat 
              ? 'bg-indigo-600 text-white' 
              : 'bg-white text-gray-600 border border-gray-200'
          }">
          ${cat}
        </button>
      `).join('');

      const containerOrder = document.getElementById('categories-order');
      containerOrder.innerHTML = categories.map(cat => `
        <button onclick="setCategoryOrder('${cat}')" 
          class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
            activeCategoryOrder === cat 
              ? 'bg-indigo-600 text-white' 
              : 'bg-white text-gray-600 border border-gray-200'
          }">
          ${cat}
        </button>
      `).join('');
    }

    function setCategoryAvail(cat) { activeCategoryAvail = cat; render(); }
    function setCategoryOrder(cat) { activeCategoryOrder = cat; render(); }

    function changeQuantity(id, delta) {
      const current = order[id] || 0;
      const next = current + delta;
      if (next <= 0) {
        delete order[id];
      } else {
        order[id] = next;
      }
      render();
    }

    function toggleAvailability(id, status) {
      const item = menu.find(i => i.id === id);
      if (item) {
        item.available = status;
        if (!status) delete order[id];
        saveMenu();
        render();
      }
    }

    function clearCart() {
      order = {};
      render();
    }

    function submitOrder() {
      if (Object.keys(order).length === 0) {
        return alert('Вы не выбрали ни одного блюда!');
      }
      document.getElementById('order-name-input').value = '';
      document.getElementById('order-note-input').value = '';
      const modal = document.getElementById('order-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => document.getElementById('order-name-input').focus(), 50);
    }

    function closeOrderModal() {
      const modal = document.getElementById('order-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function saveNewOrder() {
      const name = document.getElementById('order-name-input').value.trim();
      const note = document.getElementById('order-note-input').value.trim();

      if (!name) return alert('Введите название заказа!');

      const items = Object.keys(order).map(id => {
        const item = menu.find(i => i.id == id);
        return item ? { id: item.id, name: item.name, price: item.price, qty: order[id] } : null;
      }).filter(Boolean);

      const total = items.reduce((sum, item) => sum + item.price * item.qty, 0);

      completedOrders.unshift({
        id: Date.now(),
        name,
        note,
        items,
        total,
        createdAt: new Date().toLocaleString('ru-RU')
      });

      localStorage.setItem('waiter_veranda_orders', JSON.stringify(completedOrders));
      order = {};
      closeOrderModal();
      switchTab('orders');
    }

    function deleteCompletedOrder(id) {
      completedOrders = completedOrders.filter(item => item.id !== id);
      localStorage.setItem('waiter_veranda_orders', JSON.stringify(completedOrders));
      render();
    }

    function renderOrders() {
      const container = document.getElementById('orders-list');

      if (completedOrders.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 px-4 bg-white rounded-2xl border border-dashed border-gray-300">
            <i class="fa-solid fa-list-check text-gray-300 text-3xl mb-2"></i>
            <p class="text-gray-500 font-medium text-sm">Заказов пока нет</p>
            <p class="text-gray-400 text-xs mt-1">Нажмите «Готово» после оформления заказа.</p>
          </div>`;
        return;
      }

      container.innerHTML = completedOrders.map(savedOrder => `
        <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
          <div class="flex justify-between items-start gap-3 mb-2">
            <div>
              <div class="font-bold text-gray-800">${escapeHtml(savedOrder.name)}</div>
              <div class="text-[11px] text-gray-400">${savedOrder.createdAt}</div>
            </div>
            <button onclick="deleteCompletedOrder(${savedOrder.id})" class="text-gray-400 hover:text-red-500 px-2 py-1">Удалить</button>
          </div>
          <div class="space-y-1 mb-3">
            ${savedOrder.items.map(item => `
              <div class="flex justify-between text-sm">
                <span>${escapeHtml(item.name)} <b class="text-indigo-600">×${item.qty}</b></span>
                <span class="font-semibold">${item.price * item.qty} ₽</span>
              </div>`).join('')}
          </div>
          ${savedOrder.note ? `<div class="bg-amber-50 border border-amber-100 rounded-xl p-2.5 text-xs text-amber-800 mb-3"><b>Примечание:</b> ${escapeHtml(savedOrder.note)}</div>` : ''}
          <div class="flex justify-between items-center border-t border-gray-100 pt-2">
            <span class="font-semibold text-gray-600">Итого</span>
            <span class="font-black text-indigo-600">${savedOrder.total} ₽</span>
          </div>
        </div>`).join('');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[char]));
    }

    function render() {
      renderCategories();

      // 1. Отрисовка Вкладки «Наличие»
      const filteredAvailMenu = activeCategoryAvail === 'Все' 
        ? menu 
        : menu.filter(i => i.category === activeCategoryAvail);

      const availList = document.getElementById('availability-menu-list');
      availList.innerHTML = filteredAvailMenu.map(item => `
        <div class="bg-white p-3 rounded-xl border border-gray-200 flex justify-between items-center shadow-sm">
          <div class="pr-2">
            <div class="font-semibold text-gray-800 text-sm">${item.name}</div>
            ${item.desc ? `<div class="text-[11px] text-gray-400 leading-tight my-0.5">${item.desc}</div>` : ''}
            <div class="text-xs text-indigo-600 font-bold">${item.price} ₽</div>
          </div>
          <div class="flex gap-1.5 shrink-0">
            <button onclick="toggleAvailability(${item.id}, false)" 
              class="px-3 py-2 rounded-xl font-bold text-xs transition ${!item.available ? 'bg-red-500 text-white shadow-sm' : 'bg-gray-100 text-gray-400'}">
              - Нет
            </button>
            <button onclick="toggleAvailability(${item.id}, true)" 
              class="px-3 py-2 rounded-xl font-bold text-xs transition ${item.available ? 'bg-emerald-500 text-white shadow-sm' : 'bg-gray-100 text-gray-400'}">
              + Есть
            </button>
          </div>
        </div>
      `).join('');

      // 2. Отрисовка Вкладки «Приём заказа» (только доступные)
      const availableMenu = menu.filter(i => i.available);
      const filteredOrderMenu = activeCategoryOrder === 'Все' 
        ? availableMenu 
        : availableMenu.filter(i => i.category === activeCategoryOrder);

      const orderList = document.getElementById('order-menu-list');

      if (availableMenu.length === 0) {
        orderList.innerHTML = `
          <div class="text-center py-10 px-4 bg-white rounded-2xl border border-dashed border-gray-300">
            <i class="fa-solid fa-utensils text-gray-300 text-3xl mb-2"></i>
            <p class="text-gray-500 font-medium text-sm">Нет блюд в наличии</p>
            <p class="text-gray-400 text-xs mt-1">Отметьте блюда на кухне во вкладке «1. Наличие»</p>
          </div>
        `;
      } else if (filteredOrderMenu.length === 0) {
        orderList.innerHTML = `
          <div class="text-center py-8 text-gray-400 text-xs">
            В категории «${activeCategoryOrder}» нет блюд в наличии
          </div>
        `;
      } else {
        orderList.innerHTML = filteredOrderMenu.map(item => {
          const qty = order[item.id] || 0;
          return `
            <div class="bg-white p-3 rounded-xl border border-gray-200 flex justify-between items-center shadow-sm">
              <div class="flex-1 pr-2">
                <div class="font-semibold text-gray-800 text-sm">${item.name}</div>
                <div class="text-xs text-gray-500">${item.price} ₽</div>
              </div>

              <div class="flex items-center gap-2 bg-gray-100 p-1 rounded-xl">
                <button onclick="changeQuantity(${item.id}, -1)" class="w-8 h-8 bg-white rounded-lg shadow-sm font-bold text-gray-700 active:bg-gray-200 flex items-center justify-center text-base">-</button>
                <span class="w-6 text-center font-bold text-sm ${qty > 0 ? 'text-indigo-600' : 'text-gray-400'}">${qty}</span>
                <button onclick="changeQuantity(${item.id}, 1)" class="w-8 h-8 bg-indigo-600 text-white rounded-lg shadow-sm font-bold active:bg-indigo-700 flex items-center justify-center text-base">+</button>
              </div>
            </div>
          `;
        }).join('');
      }

      // 3. Вкладка «Заказы»
      renderOrders();

      // 4. Обновление итогов
      const summaryContainer = document.getElementById('cart-items-summary');
      const keys = Object.keys(order);
      let total = 0;
      let totalCount = 0;

      if (keys.length === 0) {
        summaryContainer.innerHTML = '<p class="text-gray-400 italic py-1">Заказ пуст</p>';
      } else {
        summaryContainer.innerHTML = keys.map(id => {
          const item = menu.find(i => i.id == id);
          if (!item) return '';
          const qty = order[id];
          const cost = item.price * qty;
          total += cost;
          totalCount += qty;
          return `
            <div class="flex justify-between items-center py-1.5">
              <span class="font-medium text-gray-700">${item.name} <b class="text-indigo-600">x${qty}</b></span>
              <span class="font-semibold text-gray-900">${cost} ₽</span>
            </div>
          `;
        }).join('');
      }

      document.getElementById('cart-total').innerText = `${total} ₽`;
      
      const badge = document.getElementById('order-badge');
      if (totalCount > 0) {
        badge.innerText = totalCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    render();
  </script>
</body>
</html>
